name: Step 1 Crawl Daily (KST)

on:
  schedule:
    # 최종: 03:11 KST
    - cron: "11 18 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install setuptools selenium undetected-chromedriver pandas gspread google-auth google-auth-oauthlib

      - name: Show environment
        run: |
          echo "Chrome path: ${{ steps.setup-chrome.outputs.chrome-path }}"
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version || true
          which xvfb-run

      - name: Run step1_crawl.py with Retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_on: error
          command: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python step1_crawl.py
        env:
          KEY1: ${{ secrets.KEY1 }}
          ECOMM_ID: ${{ secrets.ECOMM_ID }}
          ECOMM_PW: ${{ secrets.ECOMM_PW }}
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          HEADLESS: "0"

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: artifacts/
          if-no-files-found: ignore
